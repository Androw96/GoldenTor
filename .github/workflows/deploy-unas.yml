name: Deploy Golden Tor to UNAS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create private runtime files
        env:
          UNAS_DB_PASSWORD: ${{ secrets.UNAS_DB_PASSWORD }}
          UNAS_ADMIN_KEY: ${{ secrets.UNAS_ADMIN_KEY }}
          UNAS_SETUP_KEY: ${{ secrets.UNAS_SETUP_KEY }}
        run: |
          test -n "$UNAS_DB_PASSWORD"
          test -n "$UNAS_ADMIN_KEY"
          test -n "$UNAS_SETUP_KEY"
          umask 077
          cat > unas/config.php <<EOF
          <?php
          return [
              'database' => [
                  'host' => 'localhost',
                  'name' => 'smokebros_goldentor',
                  'user' => 'smokebros_golden',
                  'password' => '$UNAS_DB_PASSWORD',
              ],
              'public_url' => 'https://goldentor.hu',
              'admin_key' => '$UNAS_ADMIN_KEY',
              'contact_recipient' => 'info@goldentor.hu',
              'mail_from' => 'info@goldentor.hu',
          ];
          EOF
          sed "s/__GOLDENTOR_SETUP_KEY__/$UNAS_SETUP_KEY/g" unas/setup.php.template > unas/setup.php

      - name: Sync release over FTP
        env:
          UNAS_FTP_HOST: ${{ secrets.UNAS_FTP_HOST }}
          UNAS_FTP_USERNAME: ${{ secrets.UNAS_FTP_USERNAME }}
          UNAS_FTP_PASSWORD: ${{ secrets.UNAS_FTP_PASSWORD }}
        run: |
          test -n "$UNAS_FTP_HOST"
          test -n "$UNAS_FTP_USERNAME"
          test -n "$UNAS_FTP_PASSWORD"
          netrc_file="$(mktemp)"
          trap 'rm -f "$netrc_file"' EXIT
          umask 077
          cat > "$netrc_file" <<EOF
          machine $UNAS_FTP_HOST
          login $UNAS_FTP_USERNAME
          password $UNAS_FTP_PASSWORD
          EOF
          find . \
            \( -path './.git' -o -path './.github' -o -path './__pycache__' \
              -o -path './data' -o -path './deploy' -o -path './scripts' -o -path './tests' \) -prune -o \
            -type f -print0 | while IFS= read -r -d '' source; do
              relative_path=${source#./}
              case "$relative_path" in
                .env|.env.example|Dockerfile|HASZNALATI_UTMUTATO.md|README.md|accounts.py|server.py|unas/config.php.example|unas/DEPLOYMENT.md|unas/setup.php.template)
                  continue
                  ;;
              esac
              curl --fail --silent --show-error --retry 3 --retry-all-errors --ftp-pasv --ftp-create-dirs \
                --netrc-file "$netrc_file" --upload-file "$source" "ftp://$UNAS_FTP_HOST/$relative_path"
            done
