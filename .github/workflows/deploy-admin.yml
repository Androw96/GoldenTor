name: Filament admin – build, teszt, UNAS telepítés

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Telepítés az éles UNAS tárhelyre (kikapcsolva csak build + teszt fut)"
        type: boolean
        default: true
  push:
    paths:
      - "filament-admin/**"
      - "unas/calendar.php"
      - ".htaccess"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

env:
  # Same database as .github/workflows/deploy-unas.yml.
  UNAS_DB_NAME: smokebros_goldentor
  UNAS_DB_USER: smokebros_golden
  GOLDENTOR_PUBLIC_URL: https://goldentor.hu

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The UNAS host runs PHP 8.4 – build with the same version so composer picks compatible packages.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_sqlite, pdo_mysql, fileinfo, zip, dom, xml
          tools: composer:v2
          coverage: none

      - name: Szövegazonosítók ellenőrzése
        run: python3 scripts/tag-editable-text.py --check

      - name: Laravel 12 + Filament 5 összeállítása
        run: |
          set -euo pipefail
          composer create-project laravel/laravel:^12.0 build --prefer-dist --no-interaction --no-progress
          cd build
          composer config platform.php 8.4.1
          composer remove laravel/sanctum --no-update --no-interaction
          composer require "filament/filament:^5.0" --no-update --no-interaction
          composer update --with-all-dependencies --no-interaction --no-progress
          php ../filament-admin/build/patch-skeleton.php
          # The UNAS PHP has no "intl" extension: let Laravel's Number fall back to plain PHP formatting.
          php ../filament-admin/build/patch-number-intl.php
          rsync -a --exclude 'build/' --exclude 'deploy/' --exclude 'README.md' ../filament-admin/ ./
          composer dump-autoload --optimize
          php artisan filament:assets
          php artisan about --only=environment

      - name: Füstteszt (minden admin oldal + fő műveletek)
        working-directory: build
        env:
          APP_ENV: testing
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          GOLDENTOR_MAIL_ENABLED: "false"
          GOLDENTOR_ADMIN_KEY: ci-only-admin-key
        run: |
          php artisan test
          php ../filament-admin/build/check-routing.php ../.htaccess

      - name: Éles csomag készítése
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        working-directory: build
        env:
          UNAS_DB_PASSWORD: ${{ secrets.UNAS_DB_PASSWORD }}
          UNAS_ADMIN_KEY: ${{ secrets.UNAS_ADMIN_KEY }}
          UNAS_ADMIN_SETUP_KEY: ${{ secrets.UNAS_ADMIN_SETUP_KEY }}
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          php ../filament-admin/build/patch-number-intl.php
          grep -q 'goldentor-intl-fallback' vendor/laravel/framework/src/Illuminate/Support/Number.php
          umask 077
          php ../filament-admin/build/write-env.php .env
          rm -rf tests phpunit.xml node_modules package.json vite.config.js .git .github .editorconfig .gitattributes README.md
          find storage -type f ! -name .gitignore -delete
          zip -qr ../admin-panel.zip .
          ls -lh ../admin-panel.zip

      - name: Feltöltés és telepítés UNAS-ra
        id: install
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          UNAS_FTP_HOST: ${{ secrets.UNAS_FTP_HOST }}
          UNAS_FTP_USERNAME: ${{ secrets.UNAS_FTP_USERNAME }}
          UNAS_FTP_PASSWORD: ${{ secrets.UNAS_FTP_PASSWORD }}
          UNAS_SETUP_KEY: ${{ secrets.UNAS_SETUP_KEY }}
        run: |
          set -euo pipefail
          test -n "$UNAS_FTP_HOST"; test -n "$UNAS_FTP_USERNAME"; test -n "$UNAS_FTP_PASSWORD"; test -n "$UNAS_SETUP_KEY"
          umask 077
          php -r '$t = file_get_contents("filament-admin/deploy/admin-deploy.php.template"); file_put_contents("admin-deploy.php", str_replace("__GOLDENTOR_SETUP_KEY__", getenv("UNAS_SETUP_KEY"), $t));'
          netrc_file="$(mktemp)"
          trap 'rm -f "$netrc_file" admin-deploy.php' EXIT
          printf 'machine %s\nlogin %s\npassword %s\n' "$UNAS_FTP_HOST" "$UNAS_FTP_USERNAME" "$UNAS_FTP_PASSWORD" > "$netrc_file"
          upload() {
            curl --ipv4 --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
              --ftp-pasv --disable-epsv --ftp-skip-pasv-ip --ftp-create-dirs \
              --netrc-file "$netrc_file" --upload-file "$1" "ftp://$UNAS_FTP_HOST/$2"
          }
          upload admin-panel.zip data/admin-panel.zip
          upload admin-deploy.php unas/admin-deploy.php
          upload .htaccess .htaccess
          upload filament-admin/deploy/admin-activate.php unas/admin-activate.php
          # The admin and the booking form share the calendar rules in this file.
          upload unas/calendar.php unas/calendar.php
          echo "Telepítés a szerveren…"
          # The UNAS host does not answer over IPv6 from GitHub runners: always use IPv4.
          # Retry only while the TCP connection could not be opened at all, so the
          # installer never runs twice for one upload.
          status=000
          for attempt in 1 2 3; do
            rm -f result.json
            set +e
            out=$(curl --ipv4 --silent --show-error --connect-timeout 20 --max-time 900 -o result.json \
              -w '%{http_code} %{time_connect}' -X POST \
              -H "X-GoldenTor-Setup-Key: $UNAS_SETUP_KEY" "$GOLDENTOR_PUBLIC_URL/unas/admin-deploy.php")
            rc=$?
            set -e
            status=${out%% *}
            connected=${out##* }
            echo "Kísérlet $attempt: curl=$rc HTTP=$status kapcsolódás=${connected}s"
            if [ "$rc" -eq 0 ] || [ "$connected" != "0.000000" ]; then
              break
            fi
            sleep 20
          done
          if [ "$status" = "000" ] && [ "$connected" = "0.000000" ]; then
            # The UNAS firewall blocks HTTPS from GitHub runners at times. Everything is
            # uploaded already, so the installer can be started from a normal browser.
            echo "activated=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Aktiválásra vár::A GitHub nem éri el a goldentor.hu-t HTTPS-en (UNAS tűzfal). A kiadás feltöltve; indítsd el böngészőből: $GOLDENTOR_PUBLIC_URL/unas/admin-activate.php"
            {
              echo "### Az admin kiadás feltöltve, aktiválásra vár"
              echo "A GitHub szerverei most nem érik el HTTPS-en a goldentor.hu-t."
              echo "Nyisd meg böngészőben és nyomd meg a gombot (6 órán belül): $GOLDENTOR_PUBLIC_URL/unas/admin-activate.php"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat result.json 2>/dev/null || true; echo
          test "$status" = "200"
          grep -q '"ok": true' result.json
          echo "activated=true" >> "$GITHUB_OUTPUT"

      - name: Élő ellenőrzés
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && steps.install.outputs.activated == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          for path in / /admin/login /api/health; do
            code=$(curl --ipv4 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors -s -o /dev/null -w '%{http_code}' "$GOLDENTOR_PUBLIC_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          # Without MultiViews disabled, /admin silently serves the legacy admin.html.
          code=$(curl --ipv4 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors -s -o /dev/null -w '%{http_code}' "$GOLDENTOR_PUBLIC_URL/admin")
          echo "/admin -> $code (302 elvárt: bejelentkezés)"
          test "$code" = "302"
          code=$(curl --ipv4 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors -s -o /dev/null -w '%{http_code}' "$GOLDENTOR_PUBLIC_URL/admin-panel/.env")
          echo "/admin-panel/.env -> $code (403/404 elvárt)"
          test "$code" = "403" -o "$code" = "404"

          python3 filament-admin/deploy/smoke-live.py
