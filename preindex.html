<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Golden Tor Consulting | Kapu</title>
    <meta
      name="description"
      content="Golden Tor Consulting belépőoldal: nyissa meg a Golden Tor kapuját, és válasszon pénzügyi lehetőségeink közül."
    >
    <meta property="og:title" content="Golden Tor Consulting | Nyissa meg a kaput">
    <meta property="og:description" content="Lépjen be a Golden Tor pénzügyi lehetőségeinek világába.">
    <meta property="og:type" content="website"><meta property="og:locale" content="hu_HU"><meta property="og:image" content="assets/goldentor_logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" href="assets/favicon.png?v=2">
    <link rel="apple-touch-icon" href="assets/favicon.png?v=2">
    <link rel="stylesheet" href="styles.css?v=7">
  </head>
  <body class="preindex-page" data-page="preindex">
    <main class="preindex-shell gate-entry-shell">
      <section class="gate-hero" aria-labelledby="gate-title">
        <div class="gate-copy">
          <p class="eyebrow">Golden Tor Consulting</p>
          <h1 id="gate-title">Nyissa meg a kaput</h1>
          <p>
            Befektetés, ingatlan, finanszírozás, biztosítás és szakértői döntéstámogatás egy prémium,
            aranyfényű kapun túl.
          </p>
        </div>

        <button class="gate-button" type="button" aria-expanded="false" data-gate-button>
          <span class="gate-glow" aria-hidden="true"></span>
          <span class="gate-frame" aria-hidden="true">
            <span class="gate-door gate-door-left"></span>
            <span class="gate-door gate-door-right"></span>
            <span class="gate-line"></span>
          </span>
          <span class="gate-label">Kapu nyitása</span>
        </button>
      </section>
    </main>

    <script>
      const gateButton = document.querySelector("[data-gate-button]");
      const gateLabel = gateButton.querySelector(".gate-label");
      let gateTimers = [];

      function resetGateAnimation() {
        gateTimers.forEach((timer) => window.clearTimeout(timer));
        gateTimers = [];
        document.body.classList.remove("gate-open", "gate-enter");
        gateButton.setAttribute("aria-expanded", "false");
        gateButton.disabled = false;
        gateLabel.style.animation = "none";
        void gateLabel.offsetWidth;
        gateLabel.style.animation = "";
      }

      gateButton.addEventListener("click", () => {
        if (document.body.classList.contains("gate-open")) return;
        gateButton.disabled = true;
        document.body.classList.add("gate-open");
        gateButton.setAttribute("aria-expanded", "true");
        gateTimers.push(window.setTimeout(() => {
          document.body.classList.add("gate-enter");
        }, 620));
        gateTimers.push(window.setTimeout(() => {
          window.location.href = "welcome.html";
        }, 1680));
      });

      window.addEventListener("pageshow", resetGateAnimation);
    </script>
    <footer class="site-footer preindex-footer"><p>© 2026 Golden Tor Consulting.</p></footer>
    <script src="script.js?v=3"></script>
  </body>
</html>
