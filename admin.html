<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Golden Tor Consulting</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/favicon.png?v=2"><link rel="stylesheet" href="styles.css?v=16">
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-header">
        <a class="legal-brand" href="index.html"><img src="assets/goldentor_logo_gold.png" alt=""><span>Golden Tor Admin</span></a>
        <button class="button button-ghost" type="button" data-admin-logout>Kijelentkezés</button>
      </header>

      <section class="admin-login" data-admin-login>
        <p class="eyebrow dark">Biztonságos terület</p><h1>Admin belépés</h1>
        <form data-admin-login-form>
          <label class="full-field"><span>Admin kód</span><input type="password" name="adminKey" autocomplete="current-password" required></label>
          <button class="button button-gold" type="submit">Belépés</button>
          <p class="form-status" data-admin-login-status></p>
        </form>
      </section>

      <section class="admin-dashboard" data-admin-dashboard hidden>
        <div class="admin-tabs" role="tablist" aria-label="Admin nézetek">
          <button class="active" type="button" data-admin-tab="overview">Áttekintés</button>
          <button type="button" data-admin-tab="bookings">Foglalások</button>
          <button type="button" data-admin-tab="contacts">Új megkeresések</button>
          <button type="button" data-admin-tab="texts">Szövegek</button>
          <button type="button" data-admin-tab="blog">Blog</button>
          <button type="button" data-admin-tab="design">Design</button>
          <button type="button" data-admin-tab="content">JSON tartalom</button>
        </div>
        <div class="admin-panel" data-admin-panel="overview">
          <div class="admin-panel-heading"><h2>Üzleti áttekintés</h2><button type="button" data-admin-refresh>Frissítés</button></div>
          <div class="admin-kpi-grid" data-admin-kpis></div>
          <div class="admin-topic-chart">
            <h3>Leggyakoribb foglalási témák</h3>
            <div data-admin-topics></div>
          </div>
        </div>
        <div class="admin-panel" data-admin-panel="bookings" hidden>
          <div class="admin-panel-heading"><h2>Időpontkérések</h2><button type="button" data-admin-refresh>Frissítés</button></div>
          <div class="admin-table-wrap"><table><thead><tr><th>Időpont</th><th>Ügyfél</th><th>Téma</th><th>Forma</th><th>Státusz</th></tr></thead><tbody data-booking-rows></tbody></table></div>
        </div>
        <div class="admin-panel" data-admin-panel="contacts" hidden>
          <div class="admin-panel-heading"><h2>Új megkeresések</h2><button type="button" data-admin-refresh>Frissítés</button></div>
          <div class="admin-table-wrap"><table><thead><tr><th>Dátum</th><th>Ügyfél</th><th>Téma</th><th>Üzenet</th><th>Státusz</th></tr></thead><tbody data-contact-rows></tbody></table></div>
        </div>
        <div class="admin-panel" data-admin-panel="texts" hidden>
          <div class="admin-panel-heading"><h2>Oldalszövegek szerkesztése</h2><button type="button" data-text-load>Betöltés</button></div>
          <form class="admin-content-form" data-text-form>
            <label><span>Oldal</span><select name="page" data-text-page>
              <option value="home">Főoldal</option>
              <option value="befektetes">Befektetés</option>
              <option value="ingatlan">Ingatlan</option>
              <option value="finanszirozas">Finanszírozás</option>
              <option value="biztositas">Biztosítás</option>
              <option value="szakertoink">Szakértőink</option>
              <option value="blog">Blog</option>
              <option value="idopont">Időpont</option>
            </select></label>
            <label><span>Nyelv</span><select name="language"><option>hu</option><option>en</option><option>de</option></select></label>
            <label class="full-field"><span>Kis felirat</span><input name="eyebrow" placeholder="Csak ahol van ilyen mező"></label>
            <label class="full-field"><span>Főcím</span><input name="title" required></label>
            <label class="full-field"><span>Bevezető szöveg</span><textarea name="lead" rows="5" required></textarea></label>
            <button class="button button-gold" type="submit">Szöveg mentése</button>
            <p class="form-status" data-text-status></p>
          </form>
        </div>
        <div class="admin-panel" data-admin-panel="blog" hidden>
          <div class="admin-panel-heading"><h2>Blog hozzáférés</h2><button type="button" data-blog-load>Betöltés</button></div>
          <form class="admin-content-form" data-blog-form>
            <label><span>Nyelv</span><select name="language"><option>hu</option><option>en</option><option>de</option></select></label>
            <label><span>Kiválasztott cikk</span><select name="postIndex" data-blog-post-select></select></label>
            <label><span>Publikáció</span><select name="status"><option value="published">Publikált</option><option value="draft">Vázlat</option></select></label>
            <label><span>URL azonosító</span><input name="slug" placeholder="pl. befektetesi-strategia"></label>
            <label><span>Kategória</span><input name="category" required></label>
            <label><span>Dátum</span><input name="date" placeholder="2026. július" required></label>
            <label class="full-field"><span>Kép elérési útvonala</span><input name="image" placeholder="assets/investment.webp"></label>
            <label class="full-field"><span>Cím</span><input name="title" required></label>
            <label class="full-field"><span>Bevezető</span><textarea name="excerpt" rows="5" required></textarea></label>
            <label class="full-field"><span>Pontok, soronként egy</span><textarea name="points" rows="5"></textarea></label>
            <label class="full-field"><span>Teljes cikk szövege, bekezdésenként</span><textarea name="body" rows="10" placeholder="Minden bekezdés külön sorba kerüljön."></textarea></label>
            <div class="admin-form-actions full-field">
              <button class="button button-ghost" type="button" data-blog-new>Új cikk</button>
              <button class="button button-ghost" type="button" data-blog-duplicate>Duplikálás</button>
              <button class="button button-danger" type="button" data-blog-delete>Cikk törlése</button>
              <button class="button button-gold" type="submit">Blog mentése</button>
            </div>
            <p class="form-status" data-blog-status></p>
          </form>
        </div>
        <div class="admin-panel" data-admin-panel="design" hidden>
          <div class="admin-panel-heading"><h2>Design beállítások</h2><button type="button" data-design-load>Betöltés</button></div>
          <form class="admin-content-form design-form" data-design-form>
            <label><span>Royal blue háttér</span><input type="color" name="navy" value="#0b3478"></label>
            <label><span>Arany főszín</span><input type="color" name="gold" value="#c89b4a"></label>
            <label><span>Világos arany</span><input type="color" name="goldLight" value="#f4d88d"></label>
            <label><span>Kártya háttér</span><input type="color" name="panel" value="#123f8c"></label>
            <label><span>Hero sötétítés</span><input type="range" name="heroDarkness" min="0.45" max="0.95" step="0.05" value="0.78"></label>
            <label><span>Arany fény</span><input type="range" name="goldGlow" min="0" max="0.35" step="0.01" value="0.14"></label>
            <button class="button button-ghost" type="button" data-design-reset>Alap design</button>
            <button class="button button-gold" type="submit">Design mentése</button>
            <p class="form-status" data-design-status></p>
          </form>
        </div>
        <div class="admin-panel" data-admin-panel="content" hidden>
          <div class="admin-panel-heading"><h2>JSON tartalmi rekord</h2></div>
          <form class="admin-content-form" data-content-form>
            <label><span>Kulcs</span><input name="contentKey" placeholder="pl. experts" required></label>
            <label><span>Nyelv</span><select name="language"><option>hu</option><option>en</option><option>de</option></select></label>
            <label class="full-field"><span>Cím</span><input name="title" required></label>
            <label class="full-field"><span>JSON tartalom</span><textarea name="payload" rows="12" required>{}</textarea></label>
            <button class="button button-ghost" type="button" data-expert-template>Szakértői profilsablon</button>
            <button class="button button-gold" type="submit">Tartalom mentése</button>
            <p class="form-status" data-content-status></p>
          </form>
        </div>
      </section>
    </main>
    <script src="admin.js?v=6"></script>
  </body>
</html>
