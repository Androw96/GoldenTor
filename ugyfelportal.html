<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foglalás állapota | Golden Tor Consulting</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/favicon.png?v=2"><link rel="stylesheet" href="styles.css?v=20">
  <link rel="stylesheet" href="site.css?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
  <body class="portal-page">
    <main class="portal-shell">
      <a class="legal-brand" href="index.html"><img src="assets/goldentor_logo_gold.png" alt=""><span>Golden Tor Consulting</span></a>
      <section class="portal-card" data-portal-card>
        <p class="eyebrow dark">Ügyfélportál</p>
        <h1>Foglalás állapota</h1>
        <p data-portal-loading>Foglalási adatok betöltése...</p>
        <div data-portal-content hidden>
          <span class="portal-status" data-portal-status></span>
          <dl>
            <div><dt>Téma</dt><dd data-portal-topic></dd></div>
            <div><dt>Időpont</dt><dd data-portal-date></dd></div>
            <div><dt>Találkozás módja</dt><dd data-portal-meeting></dd></div>
          </dl>
          <div class="portal-actions">
            <a class="button button-gold" data-calendar-download>Naptárfájl letöltése</a>
            <a class="button button-ghost" target="_blank" rel="noopener" data-google-calendar>Google Calendar</a>
            <button class="button button-ghost" type="button" data-cancel-booking>Időpontkérés lemondása</button>
          </div>
          <p class="form-status" data-portal-message></p>
        </div>
      </section>
    </main>
    <script src="portal.js?v=1"></script>
    <script src="account.js?v=1"></script>
  </body>
</html>
